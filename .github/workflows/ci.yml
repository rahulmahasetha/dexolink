name: DexoLink CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag Name (e.g. v4.0.3)'
        required: false
        type: string
        default: 'v4.0.3'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS App (DMG)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run macOS Unit & Protocol Tests
        run: |
          cd macos
          swift test

      - name: Package DexoLink macOS App & DMG
        run: |
          chmod +x macos/scripts/package_dmg.sh
          ./macos/scripts/package_dmg.sh

      - name: Stage macOS Release Artifacts
        run: |
          mkdir -p macos_artifacts
          cp macos/dist/DexoLink.dmg macos_artifacts/DexoLink.dmg
          cp macos/dist/DexoLink.dmg macos_artifacts/DexoLink-v4.0.3.dmg
          ls -lh macos_artifacts/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-macOS-DMG
          path: macos_artifacts/*
          if-no-files-found: warn
          retention-days: 30

  build-android:
    name: Build & Package Android App (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew test

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug

      - name: Stage Android Release Artifacts
        run: |
          mkdir -p android_artifacts
          cp android/app/build/outputs/apk/release/app-release.apk android_artifacts/DexoLink-v4.0.3.apk 2>/dev/null || cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/DexoLink-v4.0.3.apk
          cp android/app/build/outputs/apk/release/app-release.apk android_artifacts/DexoLink-Android.apk 2>/dev/null || cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/DexoLink-Android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/app-debug.apk 2>/dev/null || true
          ls -lh android_artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-Android-APK
          path: android_artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Public GitHub Release
    needs: [build-macos, build-android]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DexoLink-macOS-DMG
          path: artifacts/macos

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DexoLink-Android-APK
          path: artifacts/android

      - name: Prepare Release Assets (Release APK & DMG Only)
        run: |
          mkdir -p release_assets
          # Collect runner-built artifacts
          cp artifacts/macos/* release_assets/ 2>/dev/null || true
          cp artifacts/android/* release_assets/ 2>/dev/null || true

          # Guaranteed fallback to verified repository release binaries if hosted runner was unavailable
          if [ ! -f release_assets/DexoLink.dmg ] && [ -f DexoLink.dmg ]; then
            echo "Staging verified repository DexoLink.dmg"
            cp DexoLink.dmg release_assets/DexoLink.dmg
            cp DexoLink-v4.0.3.dmg release_assets/DexoLink-v4.0.3.dmg 2>/dev/null || true
          fi

          if [ ! -f release_assets/DexoLink-Android.apk ] && [ -f DexoLink-Android.apk ]; then
            echo "Staging verified repository DexoLink-Android.apk"
            cp DexoLink-Android.apk release_assets/DexoLink-Android.apk
            cp DexoLink-v4.0.3.apk release_assets/DexoLink-v4.0.3.apk 2>/dev/null || true
          fi

          echo "=== Final Release Assets (Release APK & DMG Only) ==="
          ls -lh release_assets/

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink ${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v4.0.3" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink v4.0.3" >> $GITHUB_OUTPUT
          fi

      - name: Generate Categorized Changelog & Release Notes
        id: release_notes
        run: |
          chmod +x scripts/generate_release_notes.py
          python3 scripts/generate_release_notes.py \
            --tag "${{ steps.release_info.outputs.TAG }}" \
            --output release_notes.md
          echo "=== Generated Release Notes Preview ==="
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: ${{ steps.release_info.outputs.TITLE }}
          body_path: release_notes.md
          files: release_assets/*
          generate_release_notes: false
          draft: false
          prerelease: false
