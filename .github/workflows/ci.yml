name: DexoLink CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag Name (e.g. v3.0.0)'
        required: false
        type: string
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS App (DMG)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run macOS Unit & Protocol Tests
        run: |
          cd macos
          swift test

      - name: Package DexoLink macOS App & DMG
        run: |
          chmod +x macos/scripts/package_dmg.sh
          ./macos/scripts/package_dmg.sh

      - name: Stage macOS Release Artifacts
        run: |
          mkdir -p macos_artifacts
          cp macos/dist/DexoLink.dmg macos_artifacts/DexoLink.dmg
          cp macos/dist/DexoLink.dmg macos_artifacts/DexoLink-v3.0.0.dmg
          ls -lh macos_artifacts/

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-macOS-DMG
          path: macos_artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build & Package Android App (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew test

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug

      - name: Stage Android Release Artifacts
        run: |
          mkdir -p android_artifacts
          cp android/app/build/outputs/apk/release/app-release.apk android_artifacts/DexoLink-v3.0.0.apk || cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/DexoLink-v3.0.0.apk
          cp android/app/build/outputs/apk/release/app-release.apk android_artifacts/DexoLink-Android.apk || cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/DexoLink-Android.apk
          cp android/app/build/outputs/apk/release/app-release.apk android_artifacts/app-release.apk 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/app-debug.apk 2>/dev/null || true
          ls -lh android_artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-Android-APK
          path: android_artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Public GitHub Release
    needs: [build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: DexoLink-macOS-DMG
          path: artifacts/macos

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: DexoLink-Android-APK
          path: artifacts/android

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp artifacts/macos/DexoLink-v3.0.0.dmg release_assets/DexoLink-v3.0.0.dmg 2>/dev/null || cp artifacts/macos/DexoLink.dmg release_assets/DexoLink-v3.0.0.dmg 2>/dev/null || true
          cp artifacts/macos/DexoLink.dmg release_assets/DexoLink.dmg 2>/dev/null || true
          cp artifacts/android/DexoLink-v3.0.0.apk release_assets/DexoLink-v3.0.0.apk 2>/dev/null || cp artifacts/android/DexoLink-Android.apk release_assets/DexoLink-v3.0.0.apk 2>/dev/null || true
          cp artifacts/android/DexoLink-Android.apk release_assets/DexoLink-Android.apk 2>/dev/null || true
          ls -lh release_assets/

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink ${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v3.0.0" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink v3.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: ${{ steps.release_info.outputs.TITLE }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

