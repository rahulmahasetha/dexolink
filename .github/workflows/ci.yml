name: DexoLink CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag Name (e.g. v4.0.3)'
        required: false
        type: string
        default: 'v4.0.3'

permissions:
  contents: write

jobs:
  build-apple:
    name: Build & Package Apple Apps (macOS DMG & iOS IPA)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run macOS Unit & Protocol Tests
        run: |
          cd macos
          swift test

      - name: Package DexoLink macOS App & DMG
        run: |
          chmod +x macos/scripts/package_dmg.sh
          ./macos/scripts/package_dmg.sh

      - name: Package DexoLink iPhone App (.ipa)
        run: |
          chmod +x ios/scripts/package_ipa.sh
          ./ios/scripts/package_ipa.sh

      - name: Stage Apple Release Artifacts
        run: |
          mkdir -p apple_artifacts
          cp macos/dist/DexoLink.dmg apple_artifacts/DexoLink.dmg
          cp macos/dist/DexoLink.dmg apple_artifacts/DexoLink-v4.0.3.dmg
          cp ios/dist/DexoLink.ipa apple_artifacts/DexoLink.ipa
          cp ios/dist/DexoLink.ipa apple_artifacts/DexoLink-v4.0.3.ipa
          ls -lh apple_artifacts/

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-Apple-Artifacts
          path: apple_artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build & Package Android App (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew test

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug

      - name: Stage Android Release Artifacts
        run: |
          mkdir -p android_artifacts
          cp android/app/build/outputs/apk/release/app-release.apk android_artifacts/DexoLink-v4.0.3.apk 2>/dev/null || cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/DexoLink-v4.0.3.apk
          cp android/app/build/outputs/apk/release/app-release.apk android_artifacts/DexoLink-Android.apk 2>/dev/null || cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/DexoLink-Android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android_artifacts/app-debug.apk 2>/dev/null || true
          ls -lh android_artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-Android-APK
          path: android_artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows Native App (EXE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Windows Unit Tests
        run: |
          cd windows
          go test -v ./...

      - name: Build Windows Executable
        run: |
          cd windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o DexoLink.exe .
          mkdir -p ../windows_artifacts
          cp DexoLink.exe ../windows_artifacts/DexoLink.exe
          cp DexoLink.exe ../windows_artifacts/DexoLink-v4.0.3.exe
          ls -lh ../windows_artifacts/

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-Windows-EXE
          path: windows_artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Public GitHub Release
    needs: [build-apple, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Apple Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DexoLink-Apple-Artifacts
          path: artifacts/apple

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DexoLink-Android-APK
          path: artifacts/android

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DexoLink-Windows-EXE
          path: artifacts/windows

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp artifacts/apple/* release_assets/ 2>/dev/null || true
          cp artifacts/android/* release_assets/ 2>/dev/null || true
          cp artifacts/windows/* release_assets/ 2>/dev/null || true
          ls -lh release_assets/

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink ${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v4.0.3" >> $GITHUB_OUTPUT
            echo "TITLE=DexoLink v4.0.3" >> $GITHUB_OUTPUT
          fi

      - name: Generate Categorized Changelog & Release Notes
        id: release_notes
        run: |
          chmod +x scripts/generate_release_notes.py
          python3 scripts/generate_release_notes.py \
            --tag "${{ steps.release_info.outputs.TAG }}" \
            --output release_notes.md
          echo "=== Generated Release Notes Preview ==="
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: ${{ steps.release_info.outputs.TITLE }}
          body_path: release_notes.md
          files: release_assets/*
          generate_release_notes: false
          draft: false
          prerelease: false


