name: DexoLink CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build & Test macOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run macOS Unit & Protocol Tests
        run: |
          cd macos
          swift test

      - name: Package DexoLink macOS App & DMG
        run: |
          chmod +x macos/scripts/package_dmg.sh
          ./macos/scripts/package_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-macOS-DMG
          path: macos/dist/DexoLink.dmg
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew test

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexoLink-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: DexoLink-macOS-DMG
          path: artifacts/macos

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: DexoLink-Android-APK
          path: artifacts/android

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp artifacts/macos/DexoLink.dmg release_assets/DexoLink.dmg
          cp artifacts/android/app-debug.apk release_assets/DexoLink-Android.apk
          ls -lh release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
